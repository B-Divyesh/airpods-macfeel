# AirPods (LibrePods) for Hyprland ≤ 0.54 (hyprland.conf / hyprlang).
# Append to ~/.config/hypr/hyprland.conf.

exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE && systemctl --user restart librepods.service

bind = SUPER ALT, A, exec, ~/.local/bin/librepods ctl mode next
bind = SUPER ALT SHIFT, A, exec, ~/.local/bin/librepods ctl toggle
bind = SUPER ALT, C, exec, ~/.local/bin/librepods ctl ca toggle
bind = SUPER ALT, P, exec, ~/.local/bin/librepods ctl popup
bind = SUPER CTRL, A, exec, ~/.local/bin/librepods ctl open
bind = SUPER ALT, B, exec, ~/.local/bin/librepods ctl bluetooth toggle

# Window/layer rule syntax changed several times between releases; use the
# form your version's wiki shows for:
#   window class  ^(me\.kavishdevar\.librepods)$     → float, center, ~55 % × 75 %
#   layer         ^(librepods-menu|librepods-popup)$ → blur, ignore_alpha 0.3, no animation
