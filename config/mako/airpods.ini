# mako: append to ~/.config/mako/config (colours are the Ember palette; change to taste)
# AirPods (LibrePods): connected card, low-battery alerts, "pair again" prompts
[app-name=LibrePods]
border-color=#8cb3d9
max-icon-size=64
width=380
default-timeout=4000

[app-name=LibrePods urgency=critical]
border-color=#e5534b
default-timeout=0
