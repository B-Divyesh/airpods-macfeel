# AirPods (LibrePods) for sway. Append to ~/.config/sway/config
# (also a starting point for river, niri, Wayfire — anything with layer-shell).

exec systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP SWAYSOCK && systemctl --user restart librepods.service

set $pods ~/.local/bin/librepods ctl
bindsym $mod+Mod1+a       exec $pods mode next
bindsym $mod+Mod1+Shift+a exec $pods toggle
bindsym $mod+Mod1+c       exec $pods ca toggle
bindsym $mod+Mod1+p       exec $pods popup
bindsym $mod+Control+a    exec $pods open
bindsym $mod+Mod1+b       exec $pods bluetooth toggle

for_window [app_id="me.kavishdevar.librepods"] floating enable, resize set 55 ppt 75 ppt, move position center
# Blur behind the card and menu needs a compositor that blurs layers (e.g. SwayFX);
# plain sway draws them translucent.
